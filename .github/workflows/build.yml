name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev libldns-dev cython3 git zip unzip
        pip install --upgrade pip
        pip install --user --upgrade setuptools
        pip install buildozer

    - name: Pre-accept Android SDK licenses
      run: |
        mkdir -p ~/.android
        echo "24333f8a43b681621c9b6a4566bcd1f1f9cwqy" > ~/.android/repositories.cfg
        mkdir -p android/sdk/licenses
        echo -e "\n84831b8509936563e2247b539d1f14ddee044957" > android/sdk/licenses/android-sdk-license
        echo -e "\n24333f8a43b681621c9b6a4566bcd1f1f9cwqy" >> android/sdk/licenses/android-sdk-license

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
